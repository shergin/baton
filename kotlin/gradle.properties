org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official

# The publication's shared facts, which the publishing plugin reads in the
# modules that apply it; each names and describes itself in its own
# gradle.properties. The included build, baton-gradle, repeats them.
mavenCentralPublishing=true
mavenCentralAutomaticPublishing=true
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/shergin/baton
POM_LICENSE_NAME=Apache-2.0 OR MIT
POM_LICENSE_URL=https://github.com/shergin/baton/blob/master/LICENSE-APACHE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/shergin/baton
POM_SCM_CONNECTION=scm:git:git://github.com/shergin/baton.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/shergin/baton.git
POM_DEVELOPER_ID=shergin
POM_DEVELOPER_NAME=Valentin Shergin
POM_DEVELOPER_URL=https://github.com/shergin
