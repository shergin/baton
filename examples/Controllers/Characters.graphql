# A controller is not a view, so its operations are declared here rather
# than with `@Query` on a property. The cell's fragment is here too: the
# AppKit and the UIKit cell read it, and one declaration serves both.

query CharactersQuery($page: Int) {
  characters(page: $page) {
    results {
      id
      ...CharacterCell_character
    }
  }
}

fragment CharacterCell_character on Character {
  name
  status
  species
}

query CharacterQuery($id: ID!) {
  character(id: $id) {
    name
    status
    species
    origin { name }
  }
}
