# Continuous integration: the gates run locally before a commit, on the
# toolchains the README names. The Swift jobs build the compiler from the
# same checkout first, because the package's build plugin runs it and the
# repository does not carry the binary.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The boundaries inside the runtime module, as the module decision draws
  # them: which files may import SwiftUI and SQLite, and which may not name
  # the store, the environment or a transport. A ratchet: the violations it
  # tolerates are listed in the script, and the list can only shrink.
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-boundaries.sh

  # The compiler: formatting, lints as errors, and the tests, the goldens of
  # the Swift emitter among them. On Linux, because nothing in the compiler is
  # Apple's and the Kotlin runtime's builds will run it there.
  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Kotlin runtime: the common module built and tested on the JVM, the
  # development target, and the Kotlin emitter's goldens compiled against it.
  # On Linux, since nothing in it is Apple's.
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      # The Kotlin harness generates its test sources from spec/sources with
      # the compiler, found at compiler/target/release/batonc.
      - run: cargo build --release
        working-directory: compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - run: gradle --no-daemon :baton:build :goldens:compileKotlinJvm
        working-directory: kotlin

  # The package on the current Xcode. Every target builds with warnings as
  # errors: the runtime, the macros, both samples, the benchmarks and the
  # tests, generated code included.
  swift:
    runs-on: macos-26
    # A test that waits for a condition that never comes would otherwise hold
    # the runner for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          shared-key: batonc
      - run: scripts/build-compiler.sh
      - run: swift build --build-tests -Xswiftc -warnings-as-errors
      # The samples' bodies, nested `ForEach` over connections among them,
      # type-check in bounded time: an expression over 200 ms is a warning,
      # and warnings are errors. `ForEach` over `List` adds overloads beside
      # SwiftUI's, which is where the cost would come from.
      - run: >
          swift build --target RickAndMorty -Xswiftc -warnings-as-errors
          -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=200
      - run: >
          swift build --target GitHubTriage -Xswiftc -warnings-as-errors
          -Xswiftc -Xfrontend -Xswiftc -warn-long-expression-type-checking=200
      # The names of fragments and operations the corpus tests prove accepted
      # but cannot compile, type-checked one document at a time against the
      # module just built.
      - run: python3 scripts/hostile-name-sweep.py
      - run: swift test -Xswiftc -warnings-as-errors
      # The optimizer merges identical getters, and a record's invalidation
      # channels are key paths to getters; only a release build can show them
      # collide.
      - run: swift test -c release
      # Every bench once, three samples each: the suite keeps running, and a
      # bench that traps fails the build. The numbers are not recorded.
      - run: swift run -c release BatonBenchmarks --quick
      # The counts that do not depend on the machine, notifications a commit
      # path fires and events a commit logs, against the committed list: a
      # change to them is a diff to review, where a timing would be noise.
      - run: >
          swift run -c release BatonBenchmarks --quick --counts
          | grep '^count ' | diff benchmarks/counts.txt -
      # The samples and the tests are macOS executables, so nothing above
      # compiles the library for the platform it is written for.
      - run: >
          xcodebuild build -quiet -scheme Baton
          -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation -skipPackagePluginValidation
      # A framework built for distribution builds its packages with library
      # evolution, which takes no SPI protocol requirement without a default.
      # Not with warnings as errors: the macros import swift-syntax, which is
      # not built for evolution, and Swift warns about it.
      - run: >
          swift build --target Baton
          -Xswiftc -enable-library-evolution -Xswiftc -emit-module-interface
      # The runtime's API against the last release, reported in the log and
      # not enforced: before 1.0 a breaking change is expected and listed in
      # the changelog, and this is where a reviewer sees that the list is
      # whole. The tags are fetched for it.
      - run: git fetch --tags --quiet origin
      - run: swift package diagnose-api-breaking-changes v0.7.0 --targets Baton
        continue-on-error: true

  # The declared floor is a contract, so it is tested as one: the package
  # builds and its tests pass on Xcode 26.0, the first with Swift 6.2 tools.
  floor:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          shared-key: batonc
      - run: scripts/build-compiler.sh
      - run: swift test

  # The newest swift-syntax the manifest admits, where the jobs above build
  # on the committed `Package.resolved`, the floor's release: the macros
  # build and the tests pass at both ends of the range, and a swift-syntax
  # major that breaks them fails here rather than in an adopter's resolve.
  newest-syntax:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          shared-key: batonc
      - run: scripts/build-compiler.sh
      - run: swift package update swift-syntax
      - run: grep -A 4 swift-syntax.git Package.resolved
      - run: swift build --build-tests -Xswiftc -warnings-as-errors
      - run: swift test

  # A package that depends on the latest release, resolved from a clean
  # clone of its tag as an app resolves it: nothing built in the checkout, so
  # the build plugin needs the compiler bundle the release published, and the
  # runtime and the compiler are the pair that release shipped. A gate since
  # 0.7.0, the first release that published a bundle.
  consumer:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: The latest release's tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: baton
      - name: A consumer package with one document
        run: |
          mkdir -p consumer/Sources/App
          cat > consumer/Package.swift <<'SWIFT'
          // swift-tools-version: 6.2
          import PackageDescription

          let package = Package(
              name: "Consumer",
              platforms: [.macOS(.v26)],
              dependencies: [.package(path: "../baton")],
              targets: [
                  .executableTarget(
                      name: "App",
                      dependencies: [.product(name: "Baton", package: "baton")],
                      plugins: [.plugin(name: "BatonPlugin", package: "baton")]
                  ),
              ]
          )
          SWIFT
          cat > consumer/Sources/App/baton.json <<'JSON'
          { "schema": "../../../baton/spec/rickandmorty/schema.graphql" }
          JSON
          cat > consumer/Sources/App/main.swift <<'SWIFT'
          import Baton

          @MainActor
          struct Row {
              @Fragment("fragment Row_character on Character { name }")
              var character: Row_character
          }
          SWIFT
      - run: swift build --package-path consumer
