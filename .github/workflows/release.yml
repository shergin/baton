# Cuts a release from master: builds the compiler bundle for both Mac
# architectures and both Linux ones, writes the release commit (the version
# into the compiler's manifest, the bundle's checksum into Package.swift,
# the Bazel module and the Kotlin build), tags it, publishes the GitHub
# release with the bundle and the changelog's section, and publishes the
# Kotlin artifacts and the Gradle plugin to Maven Central from the tag. The
# version and the name are read from the changelog's first released heading,
# `## <version> (<name>)`, which is written beforehand, as for every release.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

# Bash with pipefail: a step whose pipeline fails fails the release before
# anything is committed or tagged.
defaults:
  run:
    shell: bash

jobs:
  # The static Linux binaries, one per architecture, each built on a host of
  # that architecture. The binary embeds no version, so these jobs build
  # master as it is and the release job stamps the bundle.
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/build-compiler-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: batonc-linux-${{ matrix.arch }}
          path: compiler/dist/linux/${{ matrix.arch }}/batonc
          if-no-files-found: error

  release:
    needs: linux
    runs-on: macos-26
    outputs:
      version: ${{ steps.heading.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Read the version and the name from the changelog
        id: heading
        run: |
          heading="$(grep -m 1 -E '^## [0-9]+\.[0-9]+\.[0-9]+ \([A-Za-z][A-Za-z -]*\)' CHANGELOG.md)"
          version="$(sed -E 's/^## ([0-9.]+) .*/\1/' <<< "$heading")"
          name="$(sed -E 's/^## [0-9.]+ \(([^)]*)\).*/\1/' <<< "$heading")"
          [[ -n "$version" && -n "$name" ]] || { echo "no released heading in CHANGELOG.md" >&2; exit 1; }
          if [[ -n "$(git ls-remote --tags origin "v$version")" ]]; then
            echo "v$version is already tagged; write the next release's section first" >&2
            exit 1
          fi
          if (( $(grep -cE "^## [0-9.]+ \($name\)" CHANGELOG.md) > 1 )); then
            echo "$name names an earlier release" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set the version
        run: |
          sed -i '' "1,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" compiler/Cargo.toml
          (cd compiler && cargo update --workspace --offline || cargo update --workspace)
      # The artifacts arrive without their mode bits; the bundle script sets
      # them again.
      - uses: actions/download-artifact@v8
        with:
          name: batonc-linux-x86_64
          path: compiler/dist/linux/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: batonc-linux-aarch64
          path: compiler/dist/linux/aarch64
      - name: Build the compiler bundle
        run: scripts/bundle-compiler.sh | tail -1 > checksum
      - name: Name the bundle in Package.swift, the Bazel module and the Kotlin build
        run: |
          checksum="$(cat checksum)"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || { echo "not a checksum: '$checksum'" >&2; exit 1; }
          sed -i '' "s/^let compilerRelease = .*/let compilerRelease = (version: \"$VERSION\", checksum: \"$checksum\")/" Package.swift
          grep -q "version: \"$VERSION\", checksum: \"$checksum\"" Package.swift
          sed -i '' "s/^    version = \".*\",$/    version = \"$VERSION\",/" bazel/MODULE.bazel
          grep -q "version = \"$VERSION\"" bazel/MODULE.bazel
          sed -i '' "s/^VERSION = \".*\"$/VERSION = \"$VERSION\"/; s/^BUNDLE_SHA256 = \".*\"$/BUNDLE_SHA256 = \"$checksum\"/" bazel/baton/release.bzl
          grep -q "VERSION = \"$VERSION\"" bazel/baton/release.bzl
          grep -q "BUNDLE_SHA256 = \"$checksum\"" bazel/baton/release.bzl
          sed -i '' "s/^version=.*/version=$VERSION/; s/^bundleSha256=.*/bundleSha256=$checksum/" kotlin/release.properties
          grep -q "^version=$VERSION$" kotlin/release.properties
          grep -q "^bundleSha256=$checksum$" kotlin/release.properties
      - name: Write the release commit and its tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "Release $VERSION ($NAME)" -- compiler/Cargo.toml compiler/Cargo.lock Package.swift bazel/MODULE.bazel bazel/baton/release.bzl kotlin/release.properties
          git tag "v$VERSION"
          git push origin HEAD:master "v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## $VERSION ($NAME)" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          gh release create "v$VERSION" compiler/dist/release/batonc.artifactbundle.zip --title "$VERSION $NAME" --notes-file notes.md

  # The Kotlin artifacts and the Gradle plugin, from the tagged commit, to
  # Maven Central: the runtime, the testing transports and the inspector in
  # one deployment, the plugin, an included build, in another; the portal
  # validates each and the plugin releases it. A missing secret fails the
  # job before anything is uploaded, so a release without the secrets is a
  # GitHub release alone, and the job is run again once they are there.
  kotlin:
    needs: release
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          [[ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [[ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [[ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]] || missing="$missing SIGNING_KEY"
          [[ -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]] || missing="$missing SIGNING_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "the repository lacks the secrets$missing; add them and run this job again" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      # The runtime's Android variant compiles against a platform the Android
      # Gradle plugin installs into the runner's SDK, as CI's kotlin job has it.
      - run: gradle --no-daemon publishToMavenCentral
        working-directory: kotlin
      - run: gradle --no-daemon publishToMavenCentral
        working-directory: kotlin/baton-gradle
