query DataCheckerTestQuery($id: ID, $size: [Int]) {
  node(id: $id) {
    id
    __typename
    ... on Page {
      actors {
        name
      }
    }
    ... on User {
      firstName
      friends(first: 3) {
        edges {
          cursor
          node {
            id
            firstName
          }
        }
      }
      profilePicture(size: $size) {
        uri
      }
    }
  }
}
