query TestNotesQuery(
  $id: ID!
) {
  character(id: $id) {
    ...TestNotes_character
    id
  }
}

fragment TestNotes_character on Character {
  name
  notes(first: 2) {
    totalCount
    edges {
      node {
        id
        text
        __typename
      }
      cursor
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
  id
}
