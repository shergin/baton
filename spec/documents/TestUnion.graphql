query TestUnion(
  $name: String!
) {
  search(name: $name) {
    __typename
    ... on Character {
      label: name
      status
    }
    ... on Location {
      label: dimension
      type
    }
    ... on Episode {
      air_date
    }
    ... on Named {
      __isNamed: __typename
      name
    }
    ... on Node {
      __isNode: __typename
      id
    }
  }
}
