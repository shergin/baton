# The test schema: the public Rick and Morty schema plus what the write- and
# list-side tests need and the public API lacks: a Node interface, a union, a
# lookup by id across types, an interface only some of the union's members
# implement, mutations with payloads, and a cursor connection
# of notes on a character with the mutations that edit it, a subscription,
# the `@defer` directive and a `@semanticNonNull` field, and the scalars the
# tokenizer fixture (`spec/tokenizer/`) reads. Documents.swift compiles
# against it unchanged; every document here would also be valid against the
# public schema except those that use the additions.

directive @defer(label: String, if: Boolean = true) on FRAGMENT_SPREAD | INLINE_FRAGMENT

interface Node {
  id: ID
}

"""Something with a name: some members of `SearchResult`, not all."""
interface Named {
  name: String
}

type Query {
  character(id: ID!): Character
  characters(page: Int, filter: FilterCharacter): Characters
  charactersByIds(ids: [ID!]!): [Character]
  location(id: ID!): Location
  locations(page: Int, filter: FilterLocation): Locations
  locationsByIds(ids: [ID!]!): [Location]
  episode(id: ID!): Episode
  episodes(page: Int, filter: FilterEpisode): Episodes
  episodesByIds(ids: [ID!]!): [Episode]
  node(id: ID!): Node
  search(name: String!): [SearchResult]
  namesake(name: String!): Named
  tokenizer: Tokenizer
}

type Mutation {
  setFavorite(id: ID!, favorite: Boolean!): FavoritePayload
  rename(id: ID!, name: String!): FavoritePayload
  addNote(characterId: ID!, text: String!): AddNotePayload
  removeNote(id: ID!): RemoveNotePayload
}

type Subscription {
  noteAdded(characterId: ID!): NoteAddedPayload
}

type NoteAddedPayload {
  noteEdge: NoteEdge
  character: Character
}

type FavoritePayload {
  character: Character
}

type AddNotePayload {
  noteEdge: NoteEdge
  note: Note
}

type RemoveNotePayload {
  removedNoteId: ID
}

union SearchResult = Character | Location | Episode

"""A value the server defines and the client keeps as the token's text."""
scalar JSON

"""Every scalar shape a response can take, for the tokenizer fixture."""
type Tokenizer {
  id: ID
  text: String
  strings: [String]
  count: Int
  counts: [Int]
  ratio: Float
  ratios: [Float]
  flag: Boolean
  flags: [Boolean]
  json: JSON
  jsons: [JSON]
}

type Character implements Node & Named {
  id: ID
  name: String
  status: String
  species: String @semanticNonNull
  type: String
  gender: String
  origin: Location
  location: Location
  image: String
  episode: [Episode]!
  created: String
  favorite: Boolean
  notes(first: Int, after: String, last: Int, before: String): NoteConnection!
}

type Note implements Node {
  id: ID
  text: String
  created: String
}

type NoteConnection {
  edges: [NoteEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type NoteEdge {
  cursor: String!
  node: Note
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Location implements Node & Named {
  id: ID
  name: String
  type: String
  dimension: String
  residents: [Character]!
  created: String
}

type Episode implements Node {
  id: ID
  name: String
  air_date: String
  episode: String
  characters: [Character]!
  created: String
}

type Characters {
  info: Info
  results: [Character]
}

type Locations {
  info: Info
  results: [Location]
}

type Episodes {
  info: Info
  results: [Episode]
}

type Info {
  count: Int
  pages: Int
  next: Int
  prev: Int
}

input FilterCharacter {
  name: String
  status: String
  species: String
  type: String
  gender: String
}

input FilterLocation {
  name: String
  type: String
  dimension: String
}

input FilterEpisode {
  name: String
  episode: String
}
