# The test schema: the public Rick and Morty schema plus what the write-side
# tests need and the public API lacks: a Node interface, a union, a lookup by
# id across types, and a mutation with a payload. Documents.swift compiles
# against it unchanged; every document here would also be valid against the
# public schema except those that use the additions.

interface Node {
  id: ID
}

type Query {
  character(id: ID!): Character
  characters(page: Int, filter: FilterCharacter): Characters
  charactersByIds(ids: [ID!]!): [Character]
  location(id: ID!): Location
  locations(page: Int, filter: FilterLocation): Locations
  locationsByIds(ids: [ID!]!): [Location]
  episode(id: ID!): Episode
  episodes(page: Int, filter: FilterEpisode): Episodes
  episodesByIds(ids: [ID!]!): [Episode]
  node(id: ID!): Node
  search(name: String!): [SearchResult]
}

type Mutation {
  setFavorite(id: ID!, favorite: Boolean!): FavoritePayload
  rename(id: ID!, name: String!): FavoritePayload
}

type FavoritePayload {
  character: Character
}

union SearchResult = Character | Location | Episode

type Character implements Node {
  id: ID
  name: String
  status: String
  species: String
  type: String
  gender: String
  origin: Location
  location: Location
  image: String
  episode: [Episode]!
  created: String
  favorite: Boolean
}

type Location implements Node {
  id: ID
  name: String
  type: String
  dimension: String
  residents: [Character]!
  created: String
}

type Episode implements Node {
  id: ID
  name: String
  air_date: String
  episode: String
  characters: [Character]!
  created: String
}

type Characters {
  info: Info
  results: [Character]
}

type Locations {
  info: Info
  results: [Location]
}

type Episodes {
  info: Info
  results: [Episode]
}

type Info {
  count: Int
  pages: Int
  next: Int
  prev: Int
}

input FilterCharacter {
  name: String
  status: String
  species: String
  type: String
  gender: String
}

input FilterLocation {
  name: String
  type: String
  dimension: String
}

input FilterEpisode {
  name: String
  episode: String
}
