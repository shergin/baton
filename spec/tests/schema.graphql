# The test schema: the public Rick and Morty schema plus what the write- and
# list-side tests need and the public API lacks: a Node interface, a union, a
# lookup by id across types, an interface only some of the union's members
# implement, mutations with payloads, one of them of every kind of scalar
# list, a field that takes a list of input objects, and a cursor connection of notes on a character, with the mutations
# that edit it, and one on the query root, a subscription, the `@defer` directive and a
# `@semanticNonNull` field, a container paged by number on the query root
# and one on a character, as AniList pages (`Page(page:, perPage:)` with one
# page info for whichever list is asked of it, and `Media.characters(page:,
# perPage:)` with `nodes` and a page info), the scalars the tokenizer fixture
# (`spec/tokenizer/`) reads, types and fields named as Swift and the
# generated code name their own, two entities keyed otherwise than by `id`
# in the tests' `baton.json`, three custom scalars it maps to Foundation
# types, and the shapes of AniList's schema the others lack: capitalized
# root fields, one spelled like its type, an enum that grows behind a
# `version` argument, and a union of twenty members with no interface.
# Documents.swift compiles against it
# unchanged; every document here would also be valid against the public
# schema except those that use the additions.

directive @defer(label: String, if: Boolean = true) on FRAGMENT_SPREAD | INLINE_FRAGMENT
directive @stream(label: String, if: Boolean = true, initialCount: Int = 0, useCustomizedBatch: Boolean = false) on FIELD

interface Node {
  id: ID
}

"""Something with a name: some members of `SearchResult`, not all."""
interface Named {
  name: String
}

type Query {
  character(id: ID!): Character
  characters(page: Int, filter: FilterCharacter): Characters
  charactersByIds(ids: [ID!]!): [Character]
  location(id: ID!): Location
  locations(page: Int, filter: FilterLocation): Locations
  locationsByIds(ids: [ID!]!): [Location]
  episode(id: ID!): Episode
  episodes(page: Int, filter: FilterEpisode): Episodes
  episodesByIds(ids: [ID!]!): [Episode]
  node(id: ID!): Node
  search(name: String!): [SearchResult]
  namesake(name: String!): Named
  tokenizer: Tokenizer
  types: Types
  spellings: [Spelling]
  charactersMatching(filters: [FilterCharacter!]!): [Character]
  asset(uuid: String!): Asset
  assets: [Asset]
  assetsPricedAbove(price: Decimal!, among: [Decimal!]): [Asset]
  charactersWithStatus(status: Status!, any: [Status!]): [Character]
  secrets(code: String!): [Secret]
  quote(base: String!, quote: String!): Quote
  quotes: [Quote]
  notes(first: Int, after: String, last: Int, before: String): NoteConnection!
  page(page: Int, perPage: Int): Page
  """A root field spelled like its type, as AniList's `Media(id:)`."""
  Episode(id: ID!): Episode
  """A capitalized root field named otherwise than its type, as AniList's `Viewer`."""
  Viewer: Character
  """A capitalized root field of scalars, as AniList's `GenreCollection`."""
  GenreCollection: [String]
  """A capitalized root field over a union of twenty members, as AniList's `Notification`; Foundation has a type of the name."""
  Notification: [NotificationUnion]
}

"""
A container paged by number, as AniList's `Page`: one page info for whichever
of its lists is asked of it, so a page record shared by two lists holds one
`pageInfo` slot, which is why a paged list's page info is its own.
"""
type Page {
  pageInfo: PageInfo!
  notes(authorId: ID): [Note]
  characters: [Character]
}

"""A list on an entity paged by number, as AniList's `Media.characters(page:, perPage:)`."""
type CharacterPage {
  pageInfo: PageInfo!
  nodes: [Character]
}

type Mutation {
  setFavorite(id: ID!, favorite: Boolean!): FavoritePayload
  rename(id: ID!, name: String!): FavoritePayload
  addNote(characterId: ID!, text: String!): AddNotePayload
  removeNote(id: ID!): RemoveNotePayload
  discardNote(id: ID!): Deleted
  discardAsset(uuid: String!): Deleted
  setLists: ListsPayload
}

type Subscription {
  noteAdded(characterId: ID!): NoteAddedPayload
}

type NoteAddedPayload {
  noteEdge: NoteEdge
  character: Character
}

type FavoritePayload {
  character: Character
}

type AddNotePayload {
  noteEdge: NoteEdge
  note: Note
}

type RemoveNotePayload {
  removedNoteId: ID
}

"""A delete answered with a boolean, as servers outside Relay's conventions answer one."""
type Deleted {
  deleted: Boolean!
}

"""Every kind of scalar list, for an optimistic response to write."""
type ListsPayload {
  strings: [String]
  ids: [ID!]!
  counts: [Int]
  ratios: [Float]
  flags: [Boolean]
  jsons: [JSON]
  statuses: [Status]
}

"""A character's status as an enum, for a list of an enum's values."""
enum Status {
  ALIVE
  DEAD
  UNKNOWN
}

union SearchResult = Character | Location | Episode

"""
An episode's broadcast, an enum that grows behind an argument: the server
answers `HIATUS` only to `status(version: 2)`, as AniList's `Media.status`
does. The argument is part of the storage key, so the two are two slots.
"""
enum EpisodeStatus {
  FINISHED
  RELEASING
  NOT_YET_RELEASED
  CANCELLED
  HIATUS
}

"""
Twenty kinds of notification with no interface among them, as AniList's
`NotificationUnion` has: a selection names each member it reads.
"""
union NotificationUnion = AiringNotification | FollowingNotification | ActivityMessageNotification | ActivityMentionNotification | ActivityReplyNotification | ActivityReplySubscribedNotification | ActivityLikeNotification | ActivityReplyLikeNotification | ThreadCommentMentionNotification | ThreadCommentReplyNotification | ThreadCommentSubscribedNotification | ThreadCommentLikeNotification | ThreadLikeNotification | RelatedMediaAdditionNotification | MediaDataChangeNotification | MediaMergeNotification | MediaDeletionNotification | MediaSubmissionUpdateNotification | StaffSubmissionUpdateNotification | CharacterSubmissionUpdateNotification

type AiringNotification {
  id: ID!
  episode: Int!
  createdAt: Int
}

type FollowingNotification {
  id: ID!
  userId: ID!
  createdAt: Int
}

type ActivityMessageNotification {
  id: ID!
  activityId: ID!
  createdAt: Int
}

type ActivityMentionNotification {
  id: ID!
  activityId: ID!
  createdAt: Int
}

type ActivityReplyNotification {
  id: ID!
  activityId: ID!
  createdAt: Int
}

type ActivityReplySubscribedNotification {
  id: ID!
  activityId: ID!
  createdAt: Int
}

type ActivityLikeNotification {
  id: ID!
  activityId: ID!
  createdAt: Int
}

type ActivityReplyLikeNotification {
  id: ID!
  activityId: ID!
  createdAt: Int
}

type ThreadCommentMentionNotification {
  id: ID!
  commentId: ID!
  createdAt: Int
}

type ThreadCommentReplyNotification {
  id: ID!
  commentId: ID!
  createdAt: Int
}

type ThreadCommentSubscribedNotification {
  id: ID!
  commentId: ID!
  createdAt: Int
}

type ThreadCommentLikeNotification {
  id: ID!
  commentId: ID!
  createdAt: Int
}

type ThreadLikeNotification {
  id: ID!
  threadId: ID!
  createdAt: Int
}

type RelatedMediaAdditionNotification {
  id: ID!
  mediaId: ID!
  createdAt: Int
}

type MediaDataChangeNotification {
  id: ID!
  mediaId: ID!
  reason: String
  createdAt: Int
}

type MediaMergeNotification {
  id: ID!
  mediaId: ID!
  deletedMediaTitles: [String]
  createdAt: Int
}

type MediaDeletionNotification {
  id: ID!
  deletedMediaTitle: String
  createdAt: Int
}

type MediaSubmissionUpdateNotification {
  id: ID!
  status: String
  createdAt: Int
}

type StaffSubmissionUpdateNotification {
  id: ID!
  status: String
  createdAt: Int
}

type CharacterSubmissionUpdateNotification {
  id: ID!
  status: String
  createdAt: Int
}

"""A value the server defines and the client keeps as the token's text."""
scalar JSON

"""Every scalar shape a response can take, for the tokenizer fixture."""
type Tokenizer {
  id: ID
  text: String
  strings: [String]
  count: Int
  counts: [Int]
  ratio: Float
  ratios: [Float]
  flag: Boolean
  flags: [Boolean]
  json: JSON
  jsons: [JSON]
}

"""A type and fields named as Swift and the generated code name their own."""
type Types {
  Type: String
  Protocol: String
  Baton: String
  Any: String
}

"""
Types named as Swift and the generated code name their own: `Baton`, the
runtime's module; `Type` and `Protocol`, which Swift reads after a dot as
metatypes; `Set`, the type of the shared file's sets of types; and `Any`,
which Swift lets no member take. The five are `Spelled`, which `Spelling`
admits with `Episode` besides, so a condition on `Spelled` is tested as a
set.
"""
interface Spelled {
  label: String
}

type Baton implements Spelled {
  id: ID
  label: String
}

type Type implements Spelled {
  id: ID
  label: String
}

type Protocol implements Spelled {
  id: ID
  label: String
}

type Set implements Spelled {
  id: ID
  label: String
}

type Any implements Spelled {
  id: ID
  label: String
}

union Spelling = Baton | Type | Protocol | Set | Any | Episode

type Character implements Node & Named {
  id: ID
  name: String
  status: String
  species: String @semanticNonNull
  type: String
  gender: String
  origin: Location
  location: Location
  image: String
  episode: [Episode]!
  created: String
  favorite: Boolean
  notes(first: Int, after: String, last: Int, before: String): NoteConnection!
  secret: Secret
  friends(page: Int, perPage: Int): CharacterPage
}

"""
Content the tests' `baton.json` keeps off the image: its records are never
written, nor a slot linking to one, nor the root field `secrets` with the
code it was asked with.
"""
type Secret {
  id: ID
  body: String
}

type Note implements Node {
  id: ID
  text: String
  created: String
  author: Character
}

"""
An entity the tests' `baton.json` keys by `uuid`, though it has an `id` as
well: the id other systems do not speak.
"""
type Asset {
  id: ID
  uuid: String!
  name: String
  size: Int
  owner: Character
  price: Decimal
  listedAt: DateTime!
  page: Url
  prices: [Decimal]
}

"""An amount as text, which the tests' `baton.json` maps to `Foundation.Decimal`."""
scalar Decimal

"""An ISO 8601 date, mapped to `Foundation.Date`."""
scalar DateTime

"""A URL as text, mapped to `Foundation.URL`."""
scalar Url

"""An entity the tests' `baton.json` keys by two fields, `base` and `quote`."""
type Quote {
  base: String!
  quote: String!
  rate: Float
}

type NoteConnection {
  edges: [NoteEdge]
  pageInfo: PageInfo!
  totalCount: Int!
}

type NoteEdge {
  cursor: String!
  node: Note
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  """The page's number, as AniList's page info carries it: copied with the rest of a page's page info, and read by no flag."""
  currentPage: Int
}

type Location implements Node & Named {
  id: ID
  name: String
  type: String
  dimension: String
  residents: [Character]!
  created: String
}

type Episode implements Node {
  id: ID
  name: String
  air_date: String
  episode: String
  characters: [Character]!
  created: String
  status(version: Int): EpisodeStatus
}

type Characters {
  info: Info
  results: [Character]
}

type Locations {
  info: Info
  results: [Location]
}

type Episodes {
  info: Info
  results: [Episode]
}

type Info {
  count: Int
  pages: Int
  next: Int
  prev: Int
}

input FilterCharacter {
  name: String
  status: String
  species: String
  type: String
  gender: String
}

input FilterLocation {
  name: String
  type: String
  dimension: String
}

input FilterEpisode {
  name: String
  episode: String
}
