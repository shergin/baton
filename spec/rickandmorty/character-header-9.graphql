# The operation that produced character-header-9.json (variables: id = "9"),
# as the compiler prints it: Relay adds the `id` fields, after the selections
# the document wrote, so the response carries each `id` last.
query TestHeaderQuery(
  $id: ID!
) {
  character(id: $id) {
    ...TestHeader_character
    id
  }
}

fragment TestHeader_character on Character {
  name
  status
  species
  image
  origin {
    name
    id
  }
}
